server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # JavaScript de la SPA debe revalidarse para evitar ejecutar módulos viejos.
    location ~* \.(?:js|mjs)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin *;
    }

    # Servir el resto de los archivos estáticos directamente.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000";
        add_header Access-Control-Allow-Origin *;
    }

    # Archivos HTML antiguos en la raíz del proyecto (no la SPA)
    location /index.html {
        try_files $uri =404;
    }
    location /login.html {
        try_files $uri =404;
    }
    location /partials/ {
        try_files $uri =404;
    }

    # SPA fallback: servir index.html para rutas de la aplicación
    location /app/ {
        try_files $uri $uri/ /index.html;
    }

    # Rutas de la aplicación (SPA mode)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Rutas API
    location /api/ {
        proxy_pass http://api:5000;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type";
    }
}